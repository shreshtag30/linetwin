# LineTwin canonical scenario: 30 stations, 3 zones, mixed-model.
#
# PARAMETER PROVENANCE — read this before trusting a number in this file.
#
# During Phase 3 planning, an earlier draft of this file cited "Future Factories V2"
# and "PyScrew" as the source of specific per-zone cycle-time means and CVs. That
# was caught and reverted before being written: this project has read PAPER
# SUMMARIES of those datasets (via literature review), not the raw tables. No
# specific number below was extracted from either dataset. Writing `source:
# future_factories_v2, mean_cycle_s: 42.3` for a number nobody actually computed
# from that data would be exactly the fabrication docs/CITATIONS.md exists to ban.
#
# So: every cycle-time, CV, and buffer-capacity value below is
# `synthetic — uncalibrated`. Future Factories V2 (real assembly pipeline, 292
# cycles, 21 cycle states) and PyScrew (real screw-driving time series) are cited
# in docs/CITATIONS.md only for the qualitative fact that real analogues with this
# general shape and variance structure exist — never as the source of a specific
# number here. What WOULD calibrate these numbers: per-station cycle logs joined
# to maintenance work orders on vehicle ID, which this project does not have
# access to (see docs/DATA.md once Phase 8 writes it).
#
# The one number in this project with a real, checkable citation is Bosch's
# published ~0.58% defect prevalence (docs/CITATIONS.md), used in Phase 8 as a
# calibration TARGET for the synthetic defect rate — never downloaded, never
# trained on, and not a cycle-time parameter at all.
#
# CORRECTION, found much later (post-Phase-10): the three zones' base_cycle_time_s
# were originally 45.0 (body) / 65.0 (paint) / 55.0 (final) -- different enough that
# paint zone was a CHRONIC, undifferentiated bottleneck by pure zone-to-zone pacing,
# completely independent of the "bottleneck" section below. Confirmed directly: even
# with bottleneck_multiplier=1.0 (no engineered perturbation at all), S13 (paint's
# entry station) sat at ~97% active with zero blocked time, body-zone tail stations
# were chronically BLOCKED, and final-zone stations were chronically STARVED --
# textbook signature of one zone permanently rate-limiting the whole line by
# construction. This silently confounded every "engineered bottleneck" scenario
# that wasn't S13 itself or immediately downstream of it (found while testing
# detector generalization against MULTIPLE distinct engineered bottlenecks --
# docs/phases/phase-05-detector-benchmark.md's addendum). Rebalanced to an equal
# 50.0s base across all three zones so the ENGINEERED bottleneck (below) is the
# only thing determining which station currently constrains the line -- each
# zone's distinctive character is now carried entirely by its own CV and buffer
# capacity, not by raw pace. Still `synthetic — uncalibrated` either way.

name: line30
description: >
  Illustrative 30-station, 3-zone mixed-model assembly line — a deliberately
  scoped subset of the brief's reference 30-50 station line.
seed: 20260826

zones:
  body:
    station_range: [1, 12]
    base_cycle_time_s: 50.0
    cv: 0.12
    buffer_capacity: 6
    provenance: synthetic — uncalibrated
  paint:
    station_range: [13, 18]
    base_cycle_time_s: 50.0
    cv: 0.22
    buffer_capacity: 4
    provenance: synthetic — uncalibrated
  final:
    station_range: [19, 30]
    base_cycle_time_s: 50.0
    cv: 0.28
    buffer_capacity: 5
    provenance: synthetic — uncalibrated

# 8 of 30 (27%) uninstrumented — heavier than "a meaningful minority" so the
# inference layer (Phase 9) is load-bearing, not decorative. See docs/DECISIONS.md.
dark_stations:
  - S07   # body:  1 of 12
  - S15   # paint: 2 of 6
  - S16
  - S22   # final: 5 of 12
  - S24
  - S27
  - S28
  - S30

bottleneck:
  station_id: S17
  # Originally 1.3. At 1.3, S17's effective mean cycle time so dominated every
  # other station that non-bottleneck perturbations of +-15% showed EXACTLY
  # 0.000 throughput change under ANY variant mix -- including 100% SUV, which
  # only reached 74.2s at a final-assembly station against S17's 89.6s. That
  # made genuine shifting-bottleneck behavior structurally impossible, not
  # merely untested. Reduced to 1.15 so a heavy SUV mix can cross over.
  cycle_time_multiplier: 1.15
  provenance: synthetic — deliberately configured, not a calibration claim

# Per-ZONE multipliers, not a single scalar per variant. A single global scalar
# would scale every station uniformly, which can never change WHICH station is
# the bottleneck (relative ordering is preserved under uniform scaling) --
# making the shifting-bottleneck requirement (Phase 4) structurally
# impossible to satisfy. Found and fixed during Phase 4 groundwork; see
# docs/phases/phase-03-simulation-core.md addendum.
#
# suv stresses final assembly hardest (more manual fitting work); hatchback is
# fastest everywhere; sedan is the baseline. synthetic — uncalibrated, same
# discipline as every other number in this file.
variants:
  - id: sedan
    weight: 0.5
    zone_multipliers: {body: 1.00, paint: 1.00, final: 1.00}
  - id: suv
    weight: 0.3
    # final was 1.35, which still couldn't close the gap to the bottleneck's
    # own SUV-adjusted mean (74.2 vs 89.6s) even at 100% SUV concentration.
    # Raised to 1.55 so a heavy-SUV mix can genuinely overtake S17.
    zone_multipliers: {body: 1.03, paint: 1.06, final: 1.55}
  - id: hatchback
    weight: 0.2
    zone_multipliers: {body: 0.97, paint: 0.92, final: 0.85}

# Rows of this operator sum to exactly 1 (partition of unity) — set in
# src/twin/graph/inference.py, not here. w_down > w_up because defects ride the
# part forward (Phase 9).
sensor_gap_weights:
  w_down: 1.0
  w_up: 0.35
  lambda: 0.15

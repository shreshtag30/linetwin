# LineTwin canonical scenario: 30 stations, 3 zones, mixed-model.
#
# PARAMETER PROVENANCE — read this before trusting a number in this file.
#
# During Phase 3 planning, an earlier draft of this file cited "Future Factories V2"
# and "PyScrew" as the source of specific per-zone cycle-time means and CVs. That
# was caught and reverted before being written: this project has read PAPER
# SUMMARIES of those datasets (via literature review), not the raw tables. No
# specific number below was extracted from either dataset. Writing `source:
# future_factories_v2, mean_cycle_s: 42.3` for a number nobody actually computed
# from that data would be exactly the fabrication docs/CITATIONS.md exists to ban.
#
# So: every cycle-time, CV, and buffer-capacity value below is
# `synthetic — uncalibrated`. Future Factories V2 (real assembly pipeline, 292
# cycles, 21 cycle states) and PyScrew (real screw-driving time series) are cited
# in docs/CITATIONS.md only for the qualitative fact that real analogues with this
# general shape and variance structure exist — never as the source of a specific
# number here. What WOULD calibrate these numbers: per-station cycle logs joined
# to maintenance work orders on vehicle ID, which this project does not have
# access to (see docs/DATA.md once Phase 8 writes it).
#
# The one number in this project with a real, checkable citation is Bosch's
# published ~0.58% defect prevalence (docs/CITATIONS.md), used in Phase 8 as a
# calibration TARGET for the synthetic defect rate — never downloaded, never
# trained on, and not a cycle-time parameter at all.
#
# CORRECTION, found much later (post-Phase-10): the three zones' base_cycle_time_s
# were originally 45.0 (body) / 65.0 (paint) / 55.0 (final) -- different enough that
# paint zone was a CHRONIC, undifferentiated bottleneck by pure zone-to-zone pacing,
# completely independent of the "bottleneck" section below. Confirmed directly: even
# with bottleneck_multiplier=1.0 (no engineered perturbation at all), S13 (paint's
# entry station) sat at ~97% active with zero blocked time, body-zone tail stations
# were chronically BLOCKED, and final-zone stations were chronically STARVED --
# textbook signature of one zone permanently rate-limiting the whole line by
# construction. This silently confounded every "engineered bottleneck" scenario
# that wasn't S13 itself or immediately downstream of it (found while testing
# detector generalization against MULTIPLE distinct engineered bottlenecks --
# docs/phases/phase-05-detector-benchmark.md's addendum). Rebalanced to an equal
# 50.0s base across all three zones so the ENGINEERED bottleneck (below) is the
# only thing determining which station currently constrains the line -- each
# zone's distinctive character is now carried entirely by its own CV and buffer
# capacity, not by raw pace. Still `synthetic — uncalibrated` either way.

name: line30
description: >
  Illustrative 30-station, 3-zone mixed-model assembly line — a deliberately
  scoped subset of the brief's reference 30-50 station line.
seed: 20260826

zones:
  body:
    station_range: [1, 12]
    base_cycle_time_s: 50.0
    cv: 0.12
    buffer_capacity: 6
    provenance: synthetic — uncalibrated
  paint:
    station_range: [13, 18]
    base_cycle_time_s: 50.0
    cv: 0.22
    # Was 4. Found live (user-reported): under the default config, BLOCKED
    # was essentially unreachable within a live-demo timescale -- the
    # offline benchmark (20,000 sim-s) shows S16 (upstream of the configured
    # bottleneck S17) accumulates ~12% blocked time by the END of that run,
    # but a fresh run shows 0.000% blocked at 5,475 sim-s (27% of the way
    # there) -- not structurally impossible, just far slower than "watch it
    # for a bit" implies. Root cause is NOT the arrival-slack fix (swept
    # ARRIVAL_SLACK_FACTOR down to 1.00 and confirmed the ~12% ceiling at S16
    # is identical regardless -- it's a local S16/S17 effect, not a
    # front-of-line pacing one). Buffer capacity, not cycle-time multiplier,
    # is the lever: tightening it lets a temporary imbalance overflow much
    # sooner without touching the bottleneck multiplier already carefully
    # tuned (1.3->1.15) for the shifting-bottleneck requirement. Verified
    # directly at capacity=2 first: S16 reached ~5% blocked by 3,000 sim-s --
    # fast, but Queue Length's already-fixed S12 confound
    # (tests/test_detectors.py explicitly forbids S12 from ever winning) came
    # back SYSTEMATICALLY: top-2 in 5/5 seeds, not the "occasional
    # near-competitor" this codebase already tolerates for S13/S19. Root
    # cause: capacity=2 tightens the S12->S13 zone-BOUNDARY buffer too, not
    # just the interior paint-zone buffers, which makes S12 itself more
    # prone to blocking and corrupts Queue Length's read on it. capacity=3
    # keeps that regression inside the already-accepted "occasional, ~1/5
    # seeds" tolerance while still reaching ~4.6% blocked at S16 by 4,000
    # sim-s (~67 real s) and ~8.6% by 8,000 sim-s (~133 real s) -- a real,
    # demo-relevant improvement over buf=4's several-minutes wait, without
    # buf=2's systemic S12 regression. Onset is still bounded by pipeline
    # fill time (units must physically traverse the 15-16 upstream stations
    # first) -- no buffer setting makes it instant.
    buffer_capacity: 3
    provenance: synthetic — uncalibrated
  final:
    station_range: [19, 30]
    base_cycle_time_s: 50.0
    cv: 0.28
    buffer_capacity: 5
    provenance: synthetic — uncalibrated

# 8 of 30 (27%) uninstrumented — heavier than "a meaningful minority" so the
# inference layer (Phase 9) is load-bearing, not decorative. See docs/DECISIONS.md.
dark_stations:
  - S07   # body:  1 of 12
  - S15   # paint: 2 of 6
  - S16
  - S22   # final: 5 of 12
  - S24
  - S27
  - S28
  - S30

bottleneck:
  station_id: S17
  # Originally 1.3. At 1.3, S17's effective mean cycle time so dominated every
  # other station that non-bottleneck perturbations of +-15% showed EXACTLY
  # 0.000 throughput change under ANY variant mix -- including 100% SUV, which
  # only reached 74.2s at a final-assembly station against S17's 89.6s. That
  # made genuine shifting-bottleneck behavior structurally impossible, not
  # merely untested. Reduced to 1.15 so a heavy SUV mix can cross over.
  cycle_time_multiplier: 1.15
  provenance: synthetic — deliberately configured, not a calibration claim

# Per-ZONE multipliers, not a single scalar per variant. A single global scalar
# would scale every station uniformly, which can never change WHICH station is
# the bottleneck (relative ordering is preserved under uniform scaling) --
# making the shifting-bottleneck requirement (Phase 4) structurally
# impossible to satisfy. Found and fixed during Phase 4 groundwork; see
# docs/phases/phase-03-simulation-core.md addendum.
#
# suv stresses final assembly hardest (more manual fitting work); hatchback is
# fastest everywhere; sedan is the baseline. synthetic — uncalibrated, same
# discipline as every other number in this file.
variants:
  - id: sedan
    weight: 0.5
    zone_multipliers: {body: 1.00, paint: 1.00, final: 1.00}
  - id: suv
    weight: 0.3
    # final was 1.35, which still couldn't close the gap to the bottleneck's
    # own SUV-adjusted mean (74.2 vs 89.6s) even at 100% SUV concentration.
    # Raised to 1.55 so a heavy-SUV mix can genuinely overtake S17.
    zone_multipliers: {body: 1.03, paint: 1.06, final: 1.55}
  - id: hatchback
    weight: 0.2
    zone_multipliers: {body: 0.97, paint: 0.92, final: 0.85}

# Rows of this operator sum to exactly 1 (partition of unity) — the identity is
# proven in src/twin/graph/inference.py; these are the weights that identity is
# computed at. w_down > w_up because defects ride the part forward (Phase 9).
#
# CORRECTION: this block was declared here from the beginning but LineConfig
# never parsed it, so graph/inference.py's hardcoded defaults were what
# actually ran and a differently-instrumented site could not retune the
# operator from configuration — which contradicted the scalability claim this
# file's own header makes. Now genuinely read (src/twin/sim/line.py).
sensor_gap_weights:
  w_down: 1.0
  w_up: 0.35
  lambda: 0.15

# Slow, spatially-correlated drift in how fast each station runs — the brief's
# "equipment wear" and "environmental conditions", which neighbouring stations
# on a real line share (common air handling, tooling replenishment cycles,
# upstream material lots).
#
# WHY THIS EXISTS: without it every station's cycle time was an INDEPENDENT
# draw around a known per-zone constant, so a neighbour's reading carried no
# information about a dark station — and the sensor-gap layer measured 33–121%
# WORSE than the trivial "just use the zone base" estimator. Harmonic extension
# requires smoothness over the graph; the simulation was violating that
# precondition by construction. See src/twin/sim/line.py:ConditionParams for
# the full structure (AR(1) in space × AR(1) in time, multiplier lognormal with
# mean exactly 1.0 so no station's long-run mean moves).
#
# synthetic — uncalibrated. What would calibrate it: the empirical
# station-to-station correlation of cycle-time residuals from a real line's MES.
# TUNING, measured not guessed. `sigma` and `temporal_phi` were swept jointly
# against two constraints that pull in opposite directions:
#   - the graph layer needs enough correlated signal to beat the "just use the
#     zone base" estimator (it now does, by ~27%);
#   - the drift must NOT be persistent enough to restructure the line, or a
#     sustained regional slowdown outcompetes the engineered bottleneck and the
#     Phase 4/5 known-ground-truth premise collapses. Measured directly: at
#     temporal_phi=0.97 the engineered S17 fell from 90% to 3% of momentary
#     picks; at 0.5 it holds ~45% and remains the clear modal constraint, and
#     the CRN-paired sensitivity analysis still ranks it first.
# A ~5-minute correlation time is short-term process variation (material lot,
# ambient swing, minor tooling state) rather than long-horizon tool wear, and
# is named that way rather than overclaimed.
condition:
  update_interval_s: 60.0
  temporal_phi: 0.5       # correlation time ~120s — perturbs readings, does not restructure the line
  spatial_alpha: 0.85     # corr(station i, i+k) = 0.85**k — what the graph exploits
  sigma: 0.08             # lognormal scale of the condition multiplier
  provenance: synthetic — uncalibrated

# Unplanned stoppages. Time-to-failure is measured in PRODUCTIVE seconds (a
# machine does not wear while starved) and is exponential, so the residual is
# memoryless — see src/twin/sim/station.py:BreakdownProfile.
#
# WHY THIS EXISTS: DOWN and REPAIR were declared in contracts.StationState and
# classified ACTIVE (which is the whole point of the Active Period Method — a
# breakdown must NOT end an active period), but nothing in the simulation ever
# entered them. mode_decomposition could therefore only ever return
# {"working": 1.0}, and the project's most load-bearing methodological claim
# guarded a transition the running system never made.
#
# At these values each station averages ~2% downtime, enough to make
# downtime-dominant constraints real without swamping the engineered
# bottleneck. Applied identically to every station, so it adds variance but no
# systematic bias, and cancels exactly in the CRN-paired sensitivity analysis.
#
# synthetic — uncalibrated. What would calibrate it: per-station-class
# MTBF/MTTR from the plant's own CMMS work-order history.
# Verified directly: breakdowns at this rate do NOT disturb the benchmark --
# the engineered S17 holds 90% of momentary picks with breakdowns enabled and
# drift off, identical to the pre-breakdown baseline. They add explicable
# events, not noise.
breakdowns:
  mtbf_productive_s: 60000.0
  detect_s: 8.0
  mttr_s: 110.0
  provenance: synthetic — uncalibrated
